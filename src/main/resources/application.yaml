server:
  port: 8081

spring:
  application:
    name: vp-analytics-ms-ingestion
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
  show-sql: false
  hibernate:
      ddl-auto: update
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect