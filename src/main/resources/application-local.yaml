spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  kafka:
    producer:
      properties:
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 10000