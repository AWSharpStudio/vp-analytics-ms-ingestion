name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Checkstyle
        run: mvn checkstyle:check

      - name: Run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5433/vp_analytics_db
          DB_USERNAME: vp_analytics_admin
          DB_PASSWORD: postgres123
          SPRING_PROFILES_ACTIVE: local
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: mvn test

  build-docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests

      - name: Build Docker image
        run: docker build -t vp-analytics-ms-ingestion:${{ github.sha }} .

      - name: Tag as latest
        run: docker tag vp-analytics-ms-ingestion:${{ github.sha }} vp-analytics-ms-ingestion:latest